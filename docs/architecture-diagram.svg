<svg width="100%" viewBox="0 0 900 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Enterprise Copilot Studio architecture with AI evaluation loop</title>
<desc id="desc">A user's browser connects to a Next.js frontend on Vercel and a FastAPI backend on Cloud Run. The backend runs a LangGraph RAG workflow with guardrails, hybrid retrieval using Qdrant and BM25, and LiteLLM generation. Generated answers pass through a Weave LLM evaluator. Failed answers are corrected and evaluated a second time; a second failure requires human review. Weave traces evaluation and production quality signals.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowFail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#993556" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
 text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
 .th { font-size:15px; font-weight:600; }
 .ts { font-size:12px; font-weight:400; }
 .small { font-size:11px; font-weight:400; }
</style>
<rect width="900" height="820" fill="#ffffff" rx="14"/>

<!-- User / Frontend -->
<rect x="360" y="25" width="180" height="42" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="th" x="450" y="46" text-anchor="middle" dominant-baseline="central" fill="#444441">User's browser</text>
<line x1="450" y1="67" x2="450" y2="95" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="275" y="97" width="350" height="65" rx="15" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="300" y="121" fill="#085041">Vercel</text>
<text class="ts" x="300" y="143" fill="#0F6E56">Next.js 15 · React 19 · Copilot UI</text>
<line x1="450" y1="162" x2="450" y2="192" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text class="small" x="460" y="181" fill="#5F5E5A">HTTPS + JWT</text>

<!-- Backend -->
<rect x="45" y="195" width="810" height="380" rx="22" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="70" y="222" fill="#3C3489">Cloud Run · FastAPI</text>
<text class="ts" x="70" y="243" fill="#534AB7">Python 3.12 · multi-tenant auth · guardrails</text>

<!-- LangGraph pipeline -->
<text class="ts" x="70" y="274" fill="#5F5E5A">LangGraph RAG workflow</text>
<rect x="70" y="287" width="110" height="42" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="0.8"/>
<text class="ts" x="125" y="308" text-anchor="middle" dominant-baseline="central" fill="#72243E">Plan / Rewrite</text>
<line x1="180" y1="308" x2="193" y2="308" stroke="#993556" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="195" y="287" width="110" height="42" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="0.8"/>
<text class="ts" x="250" y="308" text-anchor="middle" dominant-baseline="central" fill="#72243E">Hybrid Retrieve</text>
<line x1="305" y1="308" x2="318" y2="308" stroke="#993556" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="320" y="287" width="110" height="42" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="0.8"/>
<text class="ts" x="375" y="308" text-anchor="middle" dominant-baseline="central" fill="#72243E">Context</text>
<line x1="430" y1="308" x2="443" y2="308" stroke="#993556" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="445" y="287" width="110" height="42" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="0.8"/>
<text class="ts" x="500" y="308" text-anchor="middle" dominant-baseline="central" fill="#72243E">Generate</text>
<line x1="555" y1="308" x2="568" y2="308" stroke="#993556" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="570" y="287" width="110" height="42" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="0.8"/>
<text class="ts" x="625" y="308" text-anchor="middle" dominant-baseline="central" fill="#72243E">Citations</text>

<!-- Retrieval side -->
<rect x="70" y="350" width="245" height="70" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text class="th" x="192" y="375" text-anchor="middle" fill="#27500A">Retrieval</text>
<text class="small" x="192" y="396" text-anchor="middle" fill="#3B6D11">Qdrant dense + BM25 sparse + RRF</text>

<!-- Generation -->
<rect x="340" y="350" width="210" height="70" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text class="th" x="445" y="375" text-anchor="middle" fill="#633806">LiteLLM gateway</text>
<text class="small" x="445" y="396" text-anchor="middle" fill="#854F0B">Groq / OpenAI / Anthropic</text>

<!-- Evaluation -->
<rect x="575" y="350" width="245" height="70" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="th" x="697" y="375" text-anchor="middle" fill="#0C447C">W&amp;B Weave evaluator</text>
<text class="small" x="697" y="396" text-anchor="middle" fill="#185FA5">LLM judge · groundedness / hallucination</text>

<line x1="697" y1="420" x2="697" y2="445" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Evaluation decision -->
<rect x="600" y="447" width="195" height="48" rx="9" fill="#ffffff" stroke="#185FA5" stroke-width="1"/>
<text class="ts" x="697" y="471" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Pass / Fail?</text>

<!-- Correct -->
<line x1="600" y1="471" x2="520" y2="471" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>
<text class="small" x="555" y="462" text-anchor="middle" fill="#3B6D11">PASS</text>
<rect x="360" y="447" width="155" height="48" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text class="ts" x="437" y="471" text-anchor="middle" dominant-baseline="central" fill="#27500A">Verified answer</text>

<!-- Fail correction -->
<line x1="697" y1="495" x2="697" y2="520" stroke="#993556" stroke-width="1" marker-end="url(#arrowFail)"/>
<text class="small" x="710" y="511" fill="#993556">FAIL</text>
<rect x="575" y="522" width="245" height="42" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.8"/>
<text class="ts" x="697" y="543" text-anchor="middle" dominant-baseline="central" fill="#72243E">Correction LLM + evaluator feedback</text>

<!-- Second pass -->
<line x1="575" y1="543" x2="535" y2="585" stroke="#993556" stroke-width="1" marker-end="url(#arrowFail)"/>
<rect x="360" y="570" width="170" height="42" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="ts" x="445" y="591" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Evaluator — second pass</text>

<!-- Human review -->
<line x1="530" y1="591" x2="565" y2="650" stroke="#993556" stroke-width="1" marker-end="url(#arrowFail)"/>
<text class="small" x="565" y="630" fill="#993556">FAIL again</text>
<rect x="565" y="650" width="230" height="50" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.8"/>
<text class="th" x="680" y="672" text-anchor="middle" fill="#72243E">Human review required</text>
<text class="small" x="680" y="689" text-anchor="middle" fill="#993556">No unverified answer released</text>

<!-- Second pass success -->
<line x1="360" y1="591" x2="260" y2="591" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>
<text class="small" x="310" y="582" text-anchor="middle" fill="#3B6D11">PASS</text>
<rect x="70" y="566" width="185" height="50" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text class="ts" x="162" y="588" text-anchor="middle" dominant-baseline="central" fill="#27500A">Corrected verified answer</text>

<!-- Backend data services -->
<line x1="190" y1="420" x2="170" y2="730" stroke="#5F5E5A" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="445" y1="420" x2="445" y2="730" stroke="#5F5E5A" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="700" y1="420" x2="700" y2="730" stroke="#5F5E5A" stroke-width="0.8" marker-end="url(#arrow)"/>

<rect x="70" y="735" width="200" height="60" rx="11" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="th" x="170" y="758" text-anchor="middle" fill="#0C447C">PostgreSQL</text>
<text class="small" x="170" y="777" text-anchor="middle" fill="#185FA5">users · copilots · chats</text>

<rect x="345" y="735" width="200" height="60" rx="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text class="th" x="445" y="758" text-anchor="middle" fill="#27500A">Qdrant Cloud</text>
<text class="small" x="445" y="777" text-anchor="middle" fill="#3B6D11">embeddings · vector search</text>

<rect x="620" y="735" width="200" height="60" rx="11" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="th" x="720" y="758" text-anchor="middle" fill="#0C447C">W&amp;B Weave</text>
<text class="small" x="720" y="777" text-anchor="middle" fill="#185FA5">traces · evaluation results</text>
</svg>
