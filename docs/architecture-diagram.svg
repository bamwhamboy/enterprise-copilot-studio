<svg width="100%" viewBox="0 0 680 550" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Enterprise Copilot Studio architecture</title>
<desc>A user's browser connects to a Next.js frontend on Vercel, which calls a FastAPI backend on Railway over HTTPS with JWT authentication. The backend runs a five-node LangGraph workflow (plan, retrieve, build context, generate, cite) protected by guardrails and role-based access control, and connects to PostgreSQL on Render for relational data, Qdrant Cloud for vector search, and a LiteLLM gateway that calls Groq, OpenAI, or Anthropic for language model responses.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; }
  rect.box { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    svg { background: transparent; }
  }
</style>

